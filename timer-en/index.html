<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="ojapp:title" content="My Timer">
  <meta id="ojappIconMeta" name="ojapp:icon" content="./icons/blue.png">
  <meta name="ojapp:query" content="true">
  <link id="appleTouchIcon" rel="apple-touch-icon" href="./icons/blue.png">
  <link id="favicon" rel="icon" href="./icons/blue.png">
  <script>
    (() => {
      const choices = new Set(["blue", "red", "green", "purple"]);
      const requested = new URLSearchParams(location.search).get("icon");
      const icon = choices.has(requested) ? requested : "blue";
      const source = `./icons/${icon}.png`;
      document.querySelector("#ojappIconMeta").content = source;
      document.querySelector("#appleTouchIcon").href = source;
      document.querySelector("#favicon").href = source;
    })();
  </script>
  <link rel="stylesheet" href="./style.css">
  <title>My Timer | OJapp Free</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <span class="brand">OJapp Free</span>
      <h1>My Timer</h1>
    </header>

    <section id="settingsView" class="panel" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Timer Settings</h2>

      <div class="setting-block">
        <div class="setting-heading">
          <label for="minutes">Duration</label>
          <output id="minutesOutput" for="minutes">5 min</output>
        </div>
        <input id="minutes" type="range" min="1" max="60" step="1" value="5">
        <div class="range-labels" aria-hidden="true"><span>1 min</span><span>60 min</span></div>
      </div>

      <fieldset class="setting-block">
        <legend>Count Direction</legend>
        <div class="segmented">
          <input id="modeDown" type="radio" name="mode" value="down" checked>
          <label for="modeDown">COUNT DOWN</label>
          <input id="modeUp" type="radio" name="mode" value="up">
          <label for="modeUp">COUNT UP</label>
        </div>
      </fieldset>

      <div class="setting-block switch-row">
        <div>
          <label for="seconds">Show Total Seconds</label>
          <p>Turn off to use min:sec format</p>
        </div>
        <label class="switch">
          <input id="seconds" type="checkbox" checked>
          <span aria-hidden="true"></span>
        </label>
      </div>

      <fieldset class="setting-block">
        <legend>App Icon</legend>
        <div class="icon-options">
          <input id="iconBlue" type="radio" name="icon" value="blue" checked>
          <label for="iconBlue"><img src="./icons/blue.png" alt=""><span>Blue</span></label>
          <input id="iconRed" type="radio" name="icon" value="red">
          <label for="iconRed"><img src="./icons/red.png" alt=""><span>Red</span></label>
          <input id="iconGreen" type="radio" name="icon" value="green">
          <label for="iconGreen"><img src="./icons/green.png" alt=""><span>Green</span></label>
          <input id="iconPurple" type="radio" name="icon" value="purple">
          <label for="iconPurple"><img src="./icons/purple.png" alt=""><span>Purple</span></label>
        </div>
      </fieldset>

      <button id="startButton" class="primary-button" type="button">Use These Settings</button>
      <p id="urlNote" class="url-note">Confirm to open your configured URL</p>
    </section>

    <section id="timerView" class="timer-view" aria-live="polite" hidden>
      <p id="timerMode" class="timer-mode">5 min · COUNT DOWN</p>
      <div id="timerDisplay" class="timer-display">05:00</div>
      <p id="timerStatus" class="timer-status">Running</p>
      <div class="timer-actions">
        <button id="pauseButton" class="secondary-button" type="button">Pause</button>
        <button id="resetButton" class="text-button" type="button">Reset</button>
      </div>
    </section>
  </main>

  <script src="../ojapp.js"></script>
  <script src="./timer.js"></script>
</body>
</html>
