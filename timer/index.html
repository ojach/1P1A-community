<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="ojapp:title" content="My Timer">
  <meta name="ojapp:icon" content="./icon.png">
  <meta name="ojapp:query" content="true">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" href="./icon.png">
  <link rel="stylesheet" href="./style.css">
  <title>My Timer | OJapp Free</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <span class="brand">OJapp Free</span>
      <h1>My Timer</h1>
    </header>

    <section id="settingsView" class="panel" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">タイマーを設定</h2>

      <div class="setting-block">
        <div class="setting-heading">
          <label for="minutes">時間</label>
          <output id="minutesOutput" for="minutes">5分</output>
        </div>
        <input id="minutes" type="range" min="1" max="60" step="1" value="5">
        <div class="range-labels" aria-hidden="true"><span>1分</span><span>60分</span></div>
      </div>

      <fieldset class="setting-block">
        <legend>カウント方向</legend>
        <div class="segmented">
          <input id="modeDown" type="radio" name="mode" value="down" checked>
          <label for="modeDown">カウントDOWN</label>
          <input id="modeUp" type="radio" name="mode" value="up">
          <label for="modeUp">カウントUP</label>
        </div>
      </fieldset>

      <div class="setting-block switch-row">
        <div>
          <label for="seconds">秒で表示</label>
          <p>OFFでは分:秒で表示します</p>
        </div>
        <label class="switch">
          <input id="seconds" type="checkbox" checked>
          <span aria-hidden="true"></span>
        </label>
      </div>

      <button id="startButton" class="primary-button" type="button">スタート</button>
      <p id="urlNote" class="url-note">設定後、クエリ入りURLへ移動します</p>
    </section>

    <section id="timerView" class="timer-view" aria-live="polite" hidden>
      <p id="timerMode" class="timer-mode">5分・カウントDOWN</p>
      <div id="timerDisplay" class="timer-display">05:00</div>
      <p id="timerStatus" class="timer-status">計測中</p>
      <div class="timer-actions">
        <button id="pauseButton" class="secondary-button" type="button">一時停止</button>
        <button id="resetButton" class="text-button" type="button">リセット</button>
      </div>
    </section>
  </main>

  <script src="https://ojapp.app/js/ojapp_1p1a.js"></script>
  <script src="./timer.js"></script>
</body>
</html>
